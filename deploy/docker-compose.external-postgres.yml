# DBX deployment using an existing external PostgreSQL.
#
# Use this file when PostgreSQL is already running in another Docker Compose
# project on the same host and you want DBX to join that network.
#
# Prerequisite: the existing PostgreSQL must expose a Docker network named
# "sonar" (or whatever you set via SONAR_NETWORK_NAME). In the example you
# shared, that network is created by:
#
#   services:
#     postgres:
#       image: pgvector/pgvector:pg14
#       container_name: postgres
#       networks:
#         - sonar
#       ...
#   networks:
#     sonar:
#       driver: bridge
#
# DBX joins the same network and reaches PostgreSQL as "postgres:5432".
#
# Usage:
#   cp deploy/.env.example deploy/.env
#   # edit deploy/.env:
#   #   DBX_DATABASE_URL=postgresql://postgres:xmsme@123@postgres:5432/dbx
#   #   DBX_LDAP_ENABLED=true   (optional)
#   cd deploy
#   docker compose -f docker-compose.external-postgres.yml up -d
#
# To use LDAP together with external PostgreSQL, keep the ldap service enabled
# (default below) and set DBX_LDAP_ENABLED=true in your .env file.

services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: dbx-ldap
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-DBX}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.com}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme_ldap}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-changeme_ldap_config}
      LDAP_ADDITIONAL_SCHEMAS: openldap,memberof
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - type: bind
        source: ./ldap/seed.ldif
        target: /container/service/slapd/assets/config/bootstrap/ldif/custom/10-seed.ldif
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "dc=${LDAP_DOMAIN:-example},dc=com", "-s", "base", "(objectClass=*)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dbx-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dbx:
    image: t8y2/dbx:latest
    container_name: dbx
    ports:
      - "${DBX_PORT:-4224}:4224"
    environment:
      DBX_DATABASE_URL: ${DBX_DATABASE_URL:-postgresql://postgres:xmsme@123@postgres:5432/dbx}
      DBX_LDAP_ENABLED: ${DBX_LDAP_ENABLED:-false}
      DBX_LDAP_URL: ${DBX_LDAP_URL:-ldap://ldap:389}
      DBX_LDAP_BIND_DN: ${DBX_LDAP_BIND_DN:-cn=admin,dc=example,dc=com}
      DBX_LDAP_BIND_PASSWORD: ${DBX_LDAP_BIND_PASSWORD:-changeme_ldap}
      DBX_LDAP_BASE_DN: ${DBX_LDAP_BASE_DN:-dc=example,dc=com}
      DBX_LDAP_USER_SEARCH_BASE: ${DBX_LDAP_USER_SEARCH_BASE:-ou=users,dc=example,dc=com}
      DBX_LDAP_GROUP_SEARCH_BASE: ${DBX_LDAP_GROUP_SEARCH_BASE:-ou=groups,dc=example,dc=com}
      DBX_LDAP_USER_FILTER: ${DBX_LDAP_USER_FILTER:-(uid=%s)}
      DBX_LDAP_TLS_ENABLED: ${DBX_LDAP_TLS_ENABLED:-false}
      DBX_LDAP_TLS_INSECURE: ${DBX_LDAP_TLS_INSECURE:-false}
      DBX_SECURE_COOKIE: ${DBX_SECURE_COOKIE:-false}
      DBX_PASSWORD: ${DBX_PASSWORD:-changeme}
      DBX_JWT_SECRET: ${DBX_JWT_SECRET:-change_this_to_a_secure_random_string_min_32_chars}
      DBX_PORT: "4224"
      DBX_STATIC_DIR: /app/static
      DBX_DATA_DIR: /app/data
      DBX_MAX_UPLOAD_MB: ${DBX_MAX_UPLOAD_MB:-1024}
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:4224/api/auth/check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      ldap:
        condition: service_healthy
    networks:
      - dbx-network
      - ${SONAR_NETWORK_NAME:-sonar}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dbx-data:
  ldap-data:
  ldap-config:

networks:
  dbx-network:
    driver: bridge
  sonar:
    name: ${SONAR_NETWORK_NAME:-sonar}
    external: true
