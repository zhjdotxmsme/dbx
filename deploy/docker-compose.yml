services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbx} -d ${POSTGRES_DB:-dbx}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - dbx-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-DBX}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.com}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme_ldap}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-changeme_ldap_config}
      LDAP_ADDITIONAL_SCHEMAS: openldap,memberof
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - type: bind
        source: ./ldap/seed.ldif
        target: /container/service/slapd/assets/config/bootstrap/ldif/custom/10-seed.ldif
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "dc=${LDAP_DOMAIN:-example},dc=com", "-s", "base", "(objectClass=*)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dbx-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dbx:
    # Use a pre-built image for quick start. Build from source if you need customizations.
    image: t8y2/dbx:latest
    # Uncomment to build from source:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    ports:
      - "${DBX_PORT:-4224}:4224"
    environment:
      # Database
      DBX_DATABASE_URL: ${DBX_DATABASE_URL:-postgresql://dbx:changeme_postgres@postgres:5432/dbx}
      # LDAP
      DBX_LDAP_ENABLED: ${DBX_LDAP_ENABLED:-false}
      DBX_LDAP_URL: ${DBX_LDAP_URL:-ldap://ldap:389}
      DBX_LDAP_BIND_DN: ${DBX_LDAP_BIND_DN:-cn=admin,dc=example,dc=com}
      DBX_LDAP_BIND_PASSWORD: ${DBX_LDAP_BIND_PASSWORD:-changeme_ldap}
      DBX_LDAP_BASE_DN: ${DBX_LDAP_BASE_DN:-dc=example,dc=com}
      DBX_LDAP_USER_SEARCH_BASE: ${DBX_LDAP_USER_SEARCH_BASE:-ou=users,dc=example,dc=com}
      DBX_LDAP_GROUP_SEARCH_BASE: ${DBX_LDAP_GROUP_SEARCH_BASE:-ou=groups,dc=example,dc=com}
      DBX_LDAP_USER_FILTER: ${DBX_LDAP_USER_FILTER:-(uid=%s)}
      # LDAP TLS — mount certs to the paths below and set these to true
      DBX_LDAP_TLS_ENABLED: ${DBX_LDAP_TLS_ENABLED:-false}
      DBX_LDAP_TLS_INSECURE: ${DBX_LDAP_TLS_INSECURE:-false}
      # Set to true when deploying behind HTTPS so the session cookie gets Secure
      DBX_SECURE_COOKIE: ${DBX_SECURE_COOKIE:-false}
      # Local auth fallback
      DBX_PASSWORD: ${DBX_PASSWORD:-changeme}
      DBX_JWT_SECRET: ${DBX_JWT_SECRET:-change_this_to_a_secure_random_string_min_32_chars}
      # Server
      DBX_PORT: "4224"
      DBX_STATIC_DIR: /app/static
      DBX_DATA_DIR: /app/data
      DBX_MAX_UPLOAD_MB: ${DBX_MAX_UPLOAD_MB:-1024}
    volumes:
      - dbx-data:/app/data
      # Uncomment to mount custom LDAP CA cert:
      # - type: bind
      #   source: ./ldap/ca.crt
      #   target: /etc/ssl/certs/ldap-ca.crt
      #   read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:4224/api/auth/check"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy
    networks:
      - dbx-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dbx-data:
  postgres-data:
  ldap-data:
  ldap-config:

networks:
  dbx-network:
    driver: bridge
