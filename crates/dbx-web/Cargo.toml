[package]
name = "dbx-web"
version = "0.5.37"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dbx-web"
path = "src/main.rs"

[features]
default = ["mq-admin"]
mq-admin = ["dbx-core/mq-admin"]

[dependencies]
dbx-core = { path = "../dbx-core" }
redis = { version = "0.32", features = ["tokio-comp"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip", "trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
async-stream = "0.3"
futures = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde", "utc"] }
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = "0.12"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
bb8 = "0.8"
bb8-ldap = "0.4"
jsonwebtoken = "9"
config = "0.15"
dotenvy = "0.15"
strum = { version = "0.26", features = ["derive", "display", "enum-string"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
password-hash = { version = "0.5", features = ["rand_core"] }
